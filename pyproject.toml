[project]
name = "sales-ops-copilot"
version = "0.1.0"
description = "Daily Sales Ops AI brief — Salesforce + Microsoft Fabric + Azure OpenAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "azure-identity>=1.17.0",
    "requests>=2.31.0",
]

[project.scripts]
sales-ops-brief = "scripts.brief:main"
sales-ops-preflight = "scripts.preflight:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "fabric: tests that publish to a Fabric workspace (require az login)",
]
