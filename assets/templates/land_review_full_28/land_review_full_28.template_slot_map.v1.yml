deck_family: land_review_full_28
brand: simcorp
primary_template: assets/templates/land_review_full_28/LAND_review_full_28.tcseed.pptx
version: v1
rules:
  every_analytic_slide_requires:
    - S##_Title
    - S##_Source
  hard_fail_if:
    - missing_required_named_element
    - duplicate_required_name_unless_explicit_reuse
    - visible_dev_instruction_text
    - lorem_ipsum
    - off_canvas_artifacts
    - arr_acv_blending
    - unlabeled_currency_or_unit
lanes:
  ppttc_chart: real Think-Cell chart named with AddRangeData Name; data supplied through .ppttc
  ppttc_text: automation text field named with AddRangeData Name; text supplied through .ppttc
  excel_table_image: image/table placeholder named with AddRangeImage Name; data supplied through Excel UpdateBatch
  static: no dynamic binding
slides:
  - slide_id: S01
    name: Cover
    layout: canonical_cover
    elements:
      - {name: S01_DirectorName, kind: automation_text, lane: ppttc_text, required: true, source: deck_plan.director_name}
      - {name: S01_Period, kind: automation_text, lane: ppttc_text, required: true, source: deck_plan.period_label}
      - {name: S01_ScopeLabel, kind: automation_text, lane: ppttc_text, required: true, source: deck_plan.scope_label}
  - slide_id: S02
    name: Exec summary
    layout: narrative_two_column
    elements:
      - {name: S02_Title, kind: automation_text, lane: ppttc_text, required: true, source: insight_titles.S02}
      - {name: S02_ExecSummaryLeft, kind: automation_text, lane: ppttc_text, required: true, source: brief.exec_summary_left}
      - {name: S02_ExecSummaryRight, kind: automation_text, lane: ppttc_text, required: true, source: brief.exec_summary_right}
      - {name: S02_Source, kind: automation_text, lane: ppttc_text, required: true, source: source_notes.S02}
  - slide_id: S03
    name: Pipeline divider
    layout: section_divider
    elements: []
