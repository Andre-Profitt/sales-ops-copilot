[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcxml"
version = "0.1.0"
description = "Reader for think-cell's embedded chart XML (CFB-wrapped) inside .pptx files."
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tcxml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
