schema: salesops/thinkcell-binding-registry/v1
deck_family: land_review_full_28
brand: simcorp
period_context: 2026-Q2
rules:
  arr_basis: "Land+Expand ARR uses APTS_Opportunity_ARR__c; renewal ACV uses APTS_Renewal_ACV__c; never blend."
  currency_basis: "Use FX-converted Salesforce/report/model outputs; label EUR/EUR M everywhere."
  stage_basis: "SimCorp 8-stage process only."
  title_rule: "Every analytic slide requires an evidence-backed insight title."
  source_rule: "Every analytic slide requires a source note."
lanes:
  ppttc_chart: "real Think-Cell chart named with AddRangeData; data via .ppttc"
  ppttc_text: "automation text field named with AddRangeData; text via .ppttc"
  excel_table_image: "image placeholder named with AddRangeImage; refreshed via Excel UpdateBatch"
  static: "branded template-only; no dynamic binding"
slides:
  - slide_id: S01
    purpose: cover
    elements:
      - {
          name: S01_DirectorName,
          kind: text,
          lane: ppttc_text,
          required: true,
          source: director.name,
          evidence: exact_text,
        }
      - {
          name: S01_Period,
          kind: text,
          lane: ppttc_text,
          required: true,
          source: period.label,
          evidence: exact_text,
        }
      - {
          name: S01_ScopeLabel,
          kind: text,
          lane: ppttc_text,
          required: true,
          source: director.scope_label,
          evidence: exact_text,
        }
